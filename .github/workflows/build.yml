name: Build firmware

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # Commit Tasmota de reference (branche development, 16.0.0.2)
  TASMOTA_REF: a281cece518b0031e22f2317ca7dbc530c934da1
  PIO_ENV: tasmota32-zbbrdgpro-matter

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: ${{ env.TASMOTA_REF }}
          path: tasmota

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ env.TASMOTA_REF }}

      - run: pip install platformio

      # Numero de build dans le nom d'image : "16.0.0.2(zbbrdgpro-matter.12)".
      # Le script berry/github_ota.be le compare a version.json pour decider de la mise a jour
      - name: Configure build number
        run: |
          cp platformio_override.ini tasmota/
          sed -i 's/"zbbrdgpro-matter"/"zbbrdgpro-matter.${{ github.run_number }}"/' tasmota/platformio_override.ini
          grep -q 'zbbrdgpro-matter.${{ github.run_number }}' tasmota/platformio_override.ini

      - run: pio run -e ${{ env.PIO_ENV }}
        working-directory: tasmota

      - name: Write version.json
        run: |
          printf '{"tag":"%s","build":%s,"tasmota_ref":"%s"}\n' \
            "${{ github.ref_name }}" "${{ github.run_number }}" "$TASMOTA_REF" \
            > tasmota/build_output/firmware/version.json
          cat tasmota/build_output/firmware/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            tasmota/build_output/firmware/${{ env.PIO_ENV }}*
            tasmota/build_output/firmware/version.json

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # "latest" : les URL releases/latest/download/... utilisees par l'OTA pointent ici
          make_latest: true
          files: |
            tasmota/build_output/firmware/${{ env.PIO_ENV }}.bin
            tasmota/build_output/firmware/version.json
